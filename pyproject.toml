[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "os-agent-memory"
version = "0.1.0"
description = "OS Agent memory service for Kylin Linux Desktop V11"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.140.13",
    "starlette==1.3.1",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "SQLAlchemy==2.0.51",
    "PyYAML==6.0.3",
    "uvicorn==0.51.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2", "anyio==4.14.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["app*", "contracts*", "modules*", "adapters*"]
